version: '3.8'

services:
  backend:
    build: ./bubbly-backend
    container_name: bubbly-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-bubbly}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - SESSION_SECRET=${SESSION_SECRET:-your_session_secret_key_here}
      - NODE_ENV=${NODE_ENV:-production}
      - ML_SERVICE_URL=http://ml-service:5001
    restart: unless-stopped
    networks:
      - bubbly-network

  ml-service:
    build: ./bubbly-backend/ml
    container_name: bubbly-ml
    ports:
      - "5001:5001"
    environment:
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-bubbly}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
    restart: unless-stopped
    networks:
      - bubbly-network

  frontend:
    build: ./bubbly-frontend
    container_name: bubbly-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
      - ml-service
    restart: unless-stopped
    networks:
      - bubbly-network

networks:
  bubbly-network:
    driver: bridge
